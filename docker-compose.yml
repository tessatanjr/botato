version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
      - ./faiss_index:/app/faiss_index

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
